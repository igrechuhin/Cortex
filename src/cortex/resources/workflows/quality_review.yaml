name: quality_review
description: Review code quality and apply fixes.
steps:
  - session(operation="start")
  - load_context(task_description="review quality", token_budget=10000)
  - execute_pre_commit_checks(checks=["quality"])
  - execute_pre_commit_checks(checks=["fix_quality"])
  - suggest_refactoring (if needed)
  - "[execute fixes]"
keywords:
  - quality
  - review
  - lint
  - format
  - refactor
  - pre-commit
