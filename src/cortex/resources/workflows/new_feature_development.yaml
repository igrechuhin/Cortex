name: new_feature_development
description: Implement a new feature from roadmap or plan.
steps:
  - session(operation="start")
  - load_context(task_description="implement X", token_budget=10000)
  - create_plan (if not already)
  - "[implement steps]"
  - run_quality_gate()
  - run_quality_gate() (if needed)
