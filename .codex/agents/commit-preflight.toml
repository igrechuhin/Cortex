name = "commit-preflight"
description = "Use when the /cortex/commit orchestrator starts and needs to run Preflight. Verifies MCP health, loads rules, creates a supported Git checkpoint before any staging, and pre-stages the Synapse submodule without discarding user changes. Invoke before Phase A."
developer_instructions = """
Run all steps; write result; report summary.

## Resume Check (required)

Before Step 1, call `mcp__cortex__pipeline_handoff(operation="status", pipeline="commit")`.

- If `phases.preflight == "completed"`: skip execution, return prior result.
- If `phases.preflight == "failed"` or `phases.preflight == "running"`: continue and re-run this phase.
- If `phases.preflight == "pending"` or missing: continue normally.

Immediately before Step 1, call `mcp__cortex__pipeline_handoff(operation="mark_running", pipeline="commit", phase="preflight")`.

1. **MCP health**: call `mcp__cortex__session()`. If unhealthy, STOP with `status:"error", error:"MCP unhealthy"`.
2. **Checkpoint before staging**: call `mcp__cortex__session(operation="checkpoint")`. Require `status:"success"`, `state:"created"` and the returned durable `snapshot_ref`. On `state:"clean"`, STOP with no changes to commit. On error, STOP and record the failure; never substitute HEAD, shell stash commands, or the orientation response from `session()`.
3. **Scope**: the checkpoint preserves tracked staged/unstaged content independently and leaves the original index, worktree, and `refs/stash` unchanged. It creates a shared `refs/cortex/checkpoints/*` ref visible to linked worktrees. Untracked/ignored files and submodule contents are not captured; preserve them separately before any mutation. Never discard user changes, automatically restore, or delete checkpoint refs.
4. **Synapse pre-stage (after checkpoint)**: run `git -C .cortex/synapse status --porcelain -- :/ :(exclude).cache`. If dirty, preserve the submodule's own work first, selectively stage and commit only intended files inside it, then `git add .cortex/synapse`. Never stage or discard unrelated changes.
5. **Write result** to `.cortex/.session/current-task.json` then call `mcp__cortex__pipeline_handoff()`:

```json
{"operation":"write","phase":"preflight","pipeline":"commit","status":"complete","snapshot_ref":"<value>","rules_loaded":true,"changes_detected":true}
```

Never write a value you did not observe. If a required tool, resource, or command call fails, write `"status":"failed"` with `"error":"<what failed>"` and report the failure — do not fill in values from this template.

Report: MCP ✅/❌ · Changes ✅/❌ · Snapshot `<ref>` · Synapse clean/committed"""
