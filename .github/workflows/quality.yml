name: Code Quality

# HARDENING: This workflow is the single source of truth for the quality gate.
# - Configure branch protection to require this job (e.g. "Code Quality" or "quality")
#   so merges only happen when the gate passes. Do not allow bypassing.
# - All critical steps must run (no conditional skips); the summary step fails
#   if any critical step outcome is "skipped" or "failure".
#
# Option A (quality-issues-missed-investigation): (1) Ruff uses pyproject.toml
# rule set only—do NOT add --select F,E,W. (2) Quality includes type_check—
# this job runs format, lint, type_check, file sizes, function lengths, tests.
#
# Single source of truth for test command (must match pre-commit / Python adapter):
#   uv run python -m pytest tests/ -m "not slow" -n auto -v --cov=src/cortex --cov-report=xml --cov-report=term --cov-fail-under=90
# If quality gate fails on push, run this exact command locally before pushing again.

on:
  push: {}  # Run on pushes to all branches to enforce quality gate on feature branches as well as main/develop
  pull_request: {}  # Run on all PRs; branch protection should require this job
  workflow_dispatch: {}  # Run manually: Actions → Code Quality → Run workflow (if push didn't trigger)

# Allow every push to complete its run (do not cancel when a newer push happens)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    # Ensure the job stops on first failure (default behavior, but explicit is better)
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Display environment info
        run: |
          echo "=== Environment Information ==="
          echo "Python version: $(python --version)"
          echo "uv version: $(uv --version)"
          echo "Working directory: $(pwd)"
          echo "Git commit: ${{ github.sha }}"
          echo "Git ref: ${{ github.ref }}"
          echo "==============================="

      - name: Verify Synapse submodule
        run: bash scripts/check_synapse.sh

      - name: Install dependencies
        run: |
          bash scripts/bootstrap.sh

      - name: Verify tool versions
        run: |
          echo "=== Tool Versions ==="
          uv run black --version
          uv run ruff --version
          uv run pyright --version
          uv run pytest --version
          echo "===================="

      # MUST match commit prompt Step 12.1 scope (src/ tests/) and Python adapter paths
      - name: Check formatting (Black)
        id: formatting
        run: |
          echo "::group::Running Black formatting check"
          if ! uv run black --check src/ tests/; then
            echo "::error::Black formatting check failed. Run 'black src/ tests/' to fix."
            exit 1
          fi
          echo "✅ Black formatting check passed"
          echo "::endgroup::"

      - name: "Lint with ruff (Option A: pyproject.toml rule set E, F, I, B, UP)"
        id: linting
        run: |
          echo "::group::Running Ruff linting check"
          # Option A: no --select F,E,W; Ruff uses tool.ruff.lint.select from pyproject.toml
          # Note: .cortex/synapse/scripts/ is checked by the synapse scripts themselves
          if ! uv run ruff check src/ tests/; then
            echo "::error::Ruff linting check failed. Run 'ruff check --fix src/ tests/' to fix auto-fixable issues."
            exit 1
          fi
          echo "✅ Ruff linting check passed"
          echo "::endgroup::"

      - name: "Type check with pyright (source) (Option A: quality includes type_check)"
        id: type_check_src
        run: |
          echo "::group::Running Pyright type check (source)"
          # Option A: quality gate includes type_check; pyrightconfig.json has reportRedeclaration etc.
          # Try JSON output first for reliable parsing
          JSON_OUTPUT=$(uv run pyright --outputjson src/ 2>&1) || true
          TEXT_OUTPUT=$(uv run pyright src/ 2>&1) || true
          
          # Display text output for readability
          echo "$TEXT_OUTPUT"
          
          # Parse JSON output if available
          HAS_ERROR=false
          ERROR_COUNT=0
          WARNING_COUNT=0
          
          if echo "$JSON_OUTPUT" | python3 -m json.tool > /dev/null 2>&1; then
            # Parse JSON output
            ERROR_COUNT=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('summary', {}).get('errorCount', 0))" 2>/dev/null || echo "0")
            WARNING_COUNT=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data.get('summary', {}).get('warningCount', 0))" 2>/dev/null || echo "0")
            
            # Check for specific error rules in diagnostics, including rules that
            # some engines might not surface as \"error\" severity
            ERROR_RULES=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; data = json.load(sys.stdin); diags = data.get('generalDiagnostics', []); important_rules = {'reportUnknownParameterType', 'reportUnnecessaryIsInstance'}; rules = [d.get('rule', '') for d in diags if d.get('severity', '').lower() == 'error' or d.get('rule', '') in important_rules]; print(' '.join(sorted(set(filter(None, rules)))))" 2>/dev/null || echo \"\")
            
            if [ "$ERROR_COUNT" -gt 0 ] || [ "$WARNING_COUNT" -gt 0 ] || [ -n "$ERROR_RULES" ]; then
              HAS_ERROR=true
            fi
          else
            # Fallback to text parsing
            ERROR_PATTERNS=(
              "error:"
              "reportUnknownParameterType"
              "reportUnnecessaryIsInstance"
              "reportArgumentType"
              "reportUnknownVariableType"
              "reportUnknownMemberType"
              "reportAttributeAccessIssue"
              "reportAssignmentType"
              "reportIndexIssue"
              "reportOperatorIssue"
              "reportGeneralTypeIssues"
              "reportUnknownArgumentType"
              "reportOptionalSubscript"
              "reportCallIssue"
            )
            
            for pattern in "${ERROR_PATTERNS[@]}"; do
              if echo "$TEXT_OUTPUT" | grep -qi "$pattern"; then
                HAS_ERROR=true
                break
              fi
            done
            
            # Check error count in summary
            ERROR_COUNT=$(echo "$TEXT_OUTPUT" | grep -oE "[0-9]+\s+error" | grep -oE "[0-9]+" | head -1 || echo "0")
            WARNING_COUNT=$(echo "$TEXT_OUTPUT" | grep -oE "[0-9]+\s+warning" | grep -oE "[0-9]+" | head -1 || echo "0")
          fi
          
          if [ "$HAS_ERROR" = true ] || [ "$ERROR_COUNT" -gt 0 ] || [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::error::Pyright type check failed with $ERROR_COUNT error(s) and $WARNING_COUNT warning(s)."
            exit 1
          fi
          
          echo "✅ Pyright type check passed (source)"
          echo "::endgroup::"

      - name: Check formatting (synapse scripts)
        id: formatting_synapse
        run: |
          echo "::group::Running Black formatting check (synapse scripts)"
          # Use synapse script which checks synapse scripts themselves
          if ! uv run python .cortex/synapse/scripts/python/check_formatting.py; then
            echo "::error::Formatting check failed for synapse scripts. Fix formatting errors before committing."
            exit 1
          fi
          echo "✅ Black formatting check passed (synapse scripts)"
          echo "::endgroup::"

      - name: Lint with ruff (synapse scripts)
        id: linting_synapse
        run: |
          echo "::group::Running Ruff linting check (synapse scripts)"
          # Use synapse script which checks synapse scripts themselves
          if ! uv run python .cortex/synapse/scripts/python/check_linting.py; then
            echo "::error::Linting check failed for synapse scripts. Fix linting errors before committing."
            exit 1
          fi
          echo "✅ Ruff linting check passed (synapse scripts)"
          echo "::endgroup::"

      - name: "Type check with pyright (tests and scripts) (Option A: quality includes type_check)"
        id: type_check_tests
        run: |
          echo "::group::Running Pyright type check (tests and scripts)"
          # Option A: quality gate includes type_check
          # Use the check_types script which handles tests and scripts properly
          if ! uv run python .cortex/synapse/scripts/python/check_types.py; then
            echo "::error::Type check failed for tests or scripts. Fix type errors before committing."
            exit 1
          fi
          echo "✅ Pyright type check passed (tests and scripts)"
          echo "::endgroup::"

      - name: Check file sizes (max 400 lines)
        id: file_sizes
        run: |
          echo "::group::Running file size check"
          if ! uv run python .cortex/synapse/scripts/python/check_file_sizes.py; then
            echo "::error::File size check failed. Files exceeding 400 lines must be split."
            exit 1
          fi
          echo "::endgroup::"

      - name: Check function lengths (max 30 lines)
        id: function_lengths
        run: |
          echo "::group::Running function length check"
          if ! uv run python .cortex/synapse/scripts/python/check_function_lengths.py; then
            echo "::error::Function length check failed. Functions exceeding 30 lines must be refactored."
            exit 1
          fi
          echo "::endgroup::"

      - name: Check spelling (cSpell)
        id: spelling
        run: |
          echo "::group::Running spelling check"
          # Install cspell if not available (pin to 8.x to avoid npm 404 for @cspell/rpc in 9.x)
          if ! command -v cspell &> /dev/null; then
            npm install -g cspell@8.6.1
          fi
          
          # Run spelling check using the script
          if ! uv run python .cortex/synapse/scripts/python/check_spelling.py; then
            echo "::error::Spelling check failed. Fix spelling errors or add words to .cspell.json dictionary."
            exit 1
          fi
          echo "✅ Spelling check passed"
          echo "::endgroup::"
        continue-on-error: false

      - name: Check markdown files (rumdl)
        id: markdown_lint
        run: |
          echo "::group::Running markdown lint check (rumdl)"
          # Use rumdl (Rust-based Markdown linter) via the Python environment.
          # Scope and excludes mirror get_all_markdown_files_for_lint and the commit pipeline.
          if ! uv run rumdl --version >/dev/null 2>&1; then
            echo "::error::rumdl not found. Ensure 'uv sync --extra dev' has been run so rumdl is available in the virtualenv."
            exit 1
          fi
          # Limit to 500 files for parity with internal tooling
          MD_FILES=$(find . \( -name "*.md" -o -name "*.mdc" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/.venv/*" \
            -not -path "*/venv/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/.git/*" \
            -not -path "./.cortex/plans/archive/*" | head -500)
          if [ -n "$MD_FILES" ]; then
            # rumdl exits non-zero when violations are present
            if ! echo "$MD_FILES" | xargs uv run rumdl check 2>&1; then
              echo "::error::Markdown lint issues detected. Run 'uv run rumdl check --fix .' to fix auto-fixable issues."
              exit 1
            else
              echo "✅ Markdown lint check passed"
            fi
          else
            echo "No markdown files found to check"
          fi
          echo "::endgroup::"
        continue-on-error: false

      - name: Run tests
        id: tests
        run: |
          echo "::group::Running test suite (excluding slow integration tests)"
          echo "To reproduce locally (CI parity): uv run python -m pytest tests/ -m \"not slow\" -n auto -v --cov=src/cortex --cov-report=xml --cov-report=term --cov-fail-under=90"
          if ! uv run python -m pytest tests/ -m "not slow" -n auto -v --cov=src/cortex --cov-report=xml --cov-report=term --cov-fail-under=90; then
            echo "::error::Test suite failed. All tests must pass with at least 90% coverage."
            exit 1
          fi
          echo "✅ All tests passed with required coverage"
          echo "::endgroup::"

      - name: Run evaluation suite (full)
        id: eval_full
        run: |
          echo "::group::Running evaluation suite (full mode, threshold 85%)"
          if ! uv run python .cortex/synapse/scripts/python/run_eval_check.py --mode full --threshold 0.85 --output-summary eval_results.json; then
            echo "::error::Eval suite pass rate below 85%. Merge blocked."
            exit 1
          fi
          echo "✅ Eval full passed"
          echo "::endgroup::"

      - name: Compare eval to baseline (A/B on tool changes)
        id: eval_compare
        run: |
          echo "::group::A/B eval comparison to baseline"
          uv run python .cortex/synapse/scripts/python/run_eval_check.py --compare-baseline --current-results eval_results.json
          echo "::endgroup::"
        continue-on-error: false

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Health-Check Analysis
        id: health_check
        run: |
          echo "::group::Running health-check analysis"
          uv run python -m cortex.health_check \
            --type all \
            --threshold 0.75 \
            --output health-check-report.json \
            --format json
          echo "::endgroup::"
        continue-on-error: true

      - name: Upload Health-Check Report
        if: always() && steps.health_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: health-check-report
          path: health-check-report.json

      - name: Quality check summary
        if: always()
        run: |
          echo "=== Quality Check Summary ==="
          echo "Formatting: ${{ steps.formatting.outcome }}"
          echo "Formatting (Synapse): ${{ steps.formatting_synapse.outcome }}"
          echo "Linting: ${{ steps.linting.outcome }}"
          echo "Linting (Synapse): ${{ steps.linting_synapse.outcome }}"
          echo "Type Check (Source): ${{ steps.type_check_src.outcome }}"
          echo "Type Check (Tests/Scripts): ${{ steps.type_check_tests.outcome }}"
          echo "File Sizes: ${{ steps.file_sizes.outcome }}"
          echo "Function Lengths: ${{ steps.function_lengths.outcome }}"
          echo "Spelling: ${{ steps.spelling.outcome }}"
          echo "Markdown Lint: ${{ steps.markdown_lint.outcome }}"
          echo "Tests: ${{ steps.tests.outcome }}"
          echo "Eval (full): ${{ steps.eval_full.outcome }}"
          echo "Eval (A/B compare): ${{ steps.eval_compare.outcome }}"
          echo "============================="
          
          # Fail if any critical check failed
          if [ "${{ steps.formatting.outcome }}" = "failure" ] || \
             [ "${{ steps.formatting_synapse.outcome }}" = "failure" ] || \
             [ "${{ steps.linting.outcome }}" = "failure" ] || \
             [ "${{ steps.linting_synapse.outcome }}" = "failure" ] || \
             [ "${{ steps.type_check_src.outcome }}" = "failure" ] || \
             [ "${{ steps.type_check_tests.outcome }}" = "failure" ] || \
             [ "${{ steps.file_sizes.outcome }}" = "failure" ] || \
             [ "${{ steps.function_lengths.outcome }}" = "failure" ] || \
             [ "${{ steps.spelling.outcome }}" = "failure" ] || \
             [ "${{ steps.markdown_lint.outcome }}" = "failure" ] || \
             [ "${{ steps.tests.outcome }}" = "failure" ] || \
             [ "${{ steps.eval_full.outcome }}" = "failure" ] || \
             [ "${{ steps.eval_compare.outcome }}" = "failure" ]; then
            echo "::error::One or more quality checks failed. See above for details."
            exit 1
          fi

          # Fail if any critical check was skipped (hardening: no silent skips)
          if [ "${{ steps.formatting.outcome }}" = "skipped" ] || \
             [ "${{ steps.formatting_synapse.outcome }}" = "skipped" ] || \
             [ "${{ steps.linting.outcome }}" = "skipped" ] || \
             [ "${{ steps.linting_synapse.outcome }}" = "skipped" ] || \
             [ "${{ steps.type_check_src.outcome }}" = "skipped" ] || \
             [ "${{ steps.type_check_tests.outcome }}" = "skipped" ] || \
             [ "${{ steps.file_sizes.outcome }}" = "skipped" ] || \
             [ "${{ steps.function_lengths.outcome }}" = "skipped" ] || \
             [ "${{ steps.spelling.outcome }}" = "skipped" ] || \
             [ "${{ steps.markdown_lint.outcome }}" = "skipped" ] || \
             [ "${{ steps.tests.outcome }}" = "skipped" ] || \
             [ "${{ steps.eval_full.outcome }}" = "skipped" ] || \
             [ "${{ steps.eval_compare.outcome }}" = "skipped" ]; then
            echo "::error::One or more critical quality checks were skipped. All checks must run."
            exit 1
          fi
