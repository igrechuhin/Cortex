[project]
name = "cortex"
version = "0.2.0"
description = "Cortex - AI Memory & Context Management Server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0,<4",
    "mcp>=1.26.0",
    "pydantic>=2.0.0",
    "watchdog>=4.0.0",
    "tiktoken>=0.5.0",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.0",
    # Markdown lint CLI for Phase A preflight / detached worker (must sit next to the
    # interpreter when Cortex is installed via uvx or other non-dev installs).
    "rumdl>=0.1.29",
]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-randomly>=3.12.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.5.0",
]
server = [
    "httpx",
    "uvicorn",
    "starlette",
]
all = [
    "httpx",
    "uvicorn",
    "starlette",
]

[project.scripts]
cortex = "cortex.main:main"
cortex-bridge = "cortex.bridge:main"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ruff>=0.1.0",
    "pyright>=1.1.400",  # Primary type checker (CI + local); mypy config kept for optional local runs
    "detect-secrets>=1.5.0",
    "rumdl>=0.1.29",
    # PEP 517 build backend for this package; offline preflight checks it is importable in .venv.
    "uv-build>=0.11.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (isort replacement)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN401",  # disallow typing.Any in annotations (src/; tests per-file ignored)
    "TID251",  # banned-api: see banned-api config in ruff.toml
]
ignore = [
    "E501",  # Line too long (handled by Black)
]

# NOTE: the repository root `ruff.toml` takes FULL precedence over this
# `[tool.ruff]` block — ruff reads only the first config file it finds, so none
# of the settings here are active while `ruff.toml` exists. The authoritative
# lint configuration lives in `ruff.toml`; this block is retained only as a
# fallback for checkouts without it.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.ruff.lint.isort]
# Configure ruff's isort (compatible with isort's black profile by default)
known-first-party = ["cortex"]

# Optional local mypy configuration; Pyright remains the primary CI and local type checker.
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
disallow_untyped_defs = true

[tool.coverage.run]
# Coverage configuration (pytest config in pytest.ini)
# Phase 82: Each omit entry has a rationale below; permanent = no runtime logic or tested via integration.
source = ["src/cortex"]
omit = [
    # Test code and caches (not production)
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    # Package markers only (no runtime logic)
    "*/__init__.py",
    # Protocol definitions (structural subtyping; tested via implementations)
    "*/protocols/*.py",
    # Benchmark harnesses (run separately, not production paths)
    "*/benchmarks/*.py",
    # Pydantic field declarations only; no validators or runtime logic.
    # Exceptions NOT excluded: script_detection/models.py (has make_timestamp_utc()
    # and from_storage_dict()); managers/types.py (has __get_pydantic_json_schema__).
    "*/analysis/models.py",
    "*/health_check/models.py",
    "*/linking/models.py",
    "*/managers/models.py",
    "*/rules/models.py",
    "*/script_analysis/models.py",
    "*/script_promotion/models.py",
    "*/services/models.py",
    "*/structure/models.py",
    "*/tools/logging/models.py",
    "*/tools/models.py",
    "*/tools/session/models.py",
    "*/tools/skill_pack/models.py",
    "*/validation/models.py",
    # Template files contain only string constants
    "*/templates/*.py",
    # Guide files contain only string constants for documentation
    "*/guides/*.py",
    # Type alias files contain only type definitions (no runtime logic).
    # Exception NOT excluded: managers/types.py (has __get_pydantic_json_schema__ overrides).
    "*/core/types.py",
    # Optimization types contain only type aliases
    "*/optimization_types.py",
    # Strategy metrics contain Pydantic models (tested via integration)
    "*/strategy_metrics.py",
    # Strategy selection is tested via integration with context optimizer
    "*/strategy_selection.py",
    # Section processing is tested via integration
    "*/section_processing.py",
    # Structure analysis modules - tested via integration
    "*/structure_analysis.py",
    "*/structure_detection.py",
    "*/structure_metrics.py",
    # Rollback modules are tested via integration with rollback_manager
    "*/rollback_conflicts.py",
    "*/rollback_execution.py",
    # Non-Python framework adapters (require other language runtimes; tested via integration when used)
    "*/framework_adapters/go_adapter.py",
    "*/framework_adapters/java_adapter.py",
    "*/framework_adapters/javascript_adapter.py",
    "*/framework_adapters/kotlin_adapter.py",
    "*/framework_adapters/rust_adapter.py",
    "*/framework_adapters/swift_adapter.py",
    "*/framework_adapters/typescript_adapter.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cortex = [
    "resources/tiktoken_cache/*",
    "resources/workflow_schemas/*.yaml",
    "wiki/*.md",
]
